name: Bug report
description: Report a reproducible problem in PaperRoute Tracker
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve PaperRoute.
  - type: input
    id: version
    attributes:
      label: PaperRoute version
      description: Copy the version from About or Diagnostics when possible.
      placeholder: 0.3.0
    validations:
      required: true
  - type: dropdown
    id: build_source
    attributes:
      label: Release channel or build source
      options:
        - Stable release
        - Preview release
        - Portable CI build
        - Visual Studio / development build
        - Not sure
  - type: input
    id: windows_version
    attributes:
      label: Windows version
      description: Include the Windows version/build when known; you can find it in Settings > System > About.
      placeholder: Windows 11, version and build
  - type: input
    id: display_scaling
    attributes:
      label: Display scaling and window size (for layout issues)
      description: Include Windows scaling, approximate window size, and whether more than one monitor is involved. Leave blank if unrelated.
      placeholder: 125% scaling, smallest window size, one monitor
  - type: dropdown
    id: theme
    attributes:
      label: Appearance mode
      options:
        - Follow Windows
        - Light
        - Dark
        - Not relevant
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact error text when possible.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. See...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Paste relevant diagnostics after reviewing local paths or usernames you may not want to post publicly. PaperRoute diagnostics do not include manuscript content.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, anonymized spreadsheet headings, or other useful details.
