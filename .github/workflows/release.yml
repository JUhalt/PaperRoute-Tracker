name: Release
run-name: "Release - ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, Package, and Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME

          if ($tag -notmatch '^v(?<version>(?<numeric>\d+\.\d+\.\d+)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?)$') {
              throw "Release tag '$tag' is not a supported PaperRoute version tag."
          }

          $version = $Matches.version
          $numericVersion = "$($Matches.numeric).0"
          $isPrerelease = $version.Contains('-')
          $channel = if ($isPrerelease) { 'preview' } else { 'stable' }

          $notesPath = "docs/releases/$version.md"

          foreach ($requiredPath in @($notesPath, 'docs/USER_GUIDE.md', 'UPGRADE_NOTES.md', 'LICENSE.txt', 'NOTICE.md')) {
              if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf) -or
                  (Get-Item -LiteralPath $requiredPath).Length -le 0) {
                  throw "Required release document '$requiredPath' is missing or empty."
              }
          }
          if (-not $isPrerelease) {
              foreach ($statusPath in @($notesPath, 'docs/USER_GUIDE.md')) {
                  $text = Get-Content -LiteralPath $statusPath -Raw
                  if ($text -match '(?im)^\s*(?:#{1,6}\s*)?(?:\*\*)?\[?Unreleased\b|\bcurrently unreleased\b') {
                      throw "Stable publication is blocked: '$statusPath' still describes an unreleased candidate. Complete certification and reconcile release metadata first."
                  }
              }
          }
          $project = [xml]::new()
          $project.XmlResolver = $null
          $project.Load((Join-Path $env:GITHUB_WORKSPACE 'ManuscriptPipeline/ManuscriptPipeline.vbproj'))
          foreach ($pair in @(@('Version', $version), @('AssemblyVersion', $numericVersion), @('FileVersion', $numericVersion))) {
              $nodes = @($project.SelectNodes("/Project/PropertyGroup/$($pair[0])"))
              if ($nodes.Count -ne 1 -or $nodes[0].InnerText -cne $pair[1]) {
                  throw "Project $($pair[0]) must explicitly equal '$($pair[1])'; a tag must not mask stale source metadata."
              }
          }
          $runtime = @($project.SelectNodes('/Project/ItemGroup/PackageReference[@Include="Velopack"]'))
          if ($runtime.Count -ne 1 -or $runtime[0].GetAttribute('Version') -cne '1.2.0') {
              throw 'The runtime and release packager must both use Velopack 1.2.0.'
          }

          Write-Host "Tag:        $tag"
          Write-Host "Version:    $version"
          Write-Host "Channel:    $channel"
          Write-Host "Prerelease: $isPrerelease"
          Write-Host "Notes:      $notesPath"

          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric_version=$numericVersion" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "is_prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Reject an existing release for this tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp
          if ($LASTEXITCODE -ne 0) { throw 'Cannot safely check existing releases.' }
          $pages = ($json | Out-String) | ConvertFrom-Json -NoEnumerate
          $existing = @($pages | ForEach-Object { $_ } | ForEach-Object { $_ } |
              Where-Object { $_.tag_name -ceq $env:GITHUB_REF_NAME -or $_.name -ceq "PaperRoute Tracker $env:GITHUB_REF_NAME" })
          if ($existing.Count -gt 0) {
              throw 'A matching release already exists. Published releases are never overwritten; inspect any failed draft before a new attempt.'
          }

      - name: Restore dependencies
        run: dotnet restore ManuscriptPipeline.slnx

      - name: Build release candidate
        run: >
          dotnet build
          ManuscriptPipeline.slnx
          --configuration Release
          --no-restore
          -p:Version="${{ steps.meta.outputs.version }}"
          -p:ContinuousIntegrationBuild=true

      - name: Run automated tests
        shell: pwsh
        run: |
          dotnet test PaperRoute.Tests/PaperRoute.Tests.vbproj --configuration Release --no-build --no-restore `
              --logger 'trx;LogFileName=PaperRoute.Tests.trx' --results-directory "$env:GITHUB_WORKSPACE/TestResults"
          if ($LASTEXITCODE -ne 0) { throw 'The automated test run failed.' }
          $trx = [xml]::new()
          $trx.XmlResolver = $null
          $trx.Load((Join-Path $env:GITHUB_WORKSPACE 'TestResults/PaperRoute.Tests.trx'))
          $counters = $trx.SelectSingleNode('//*[local-name()="ResultSummary"]/*[local-name()="Counters"]')
          if ($null -eq $counters -or [int] $counters.GetAttribute('total') -lt 1 -or
              [int] $counters.GetAttribute('passed') -ne [int] $counters.GetAttribute('total')) {
              throw 'Release tests must all pass, with none skipped or inconclusive.'
          }
          "Release tests: $($counters.GetAttribute('passed')) passed; none skipped." >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve release test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: PaperRoute-release-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Windows x64 for installer
        run: >
          dotnet publish
          ManuscriptPipeline/ManuscriptPipeline.vbproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:Version="${{ steps.meta.outputs.version }}"
          -p:ContinuousIntegrationBuild=true
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:PublishDir=${{ github.workspace }}/publish/win-x64/

      - name: Verify published binary versions and required payload
        shell: pwsh
        run: |
          $expected = "${{ steps.meta.outputs.version }}"

          $publishedDll = Join-Path `
              "${{ github.workspace }}" `
              "publish\win-x64\PaperRouteTracker.dll"

          if (-not (Test-Path $publishedDll)) {
              throw "Published PaperRouteTracker.dll was not found at '$publishedDll'."
          }

          $versionInfo =
              [System.Diagnostics.FileVersionInfo]::GetVersionInfo(
                  $publishedDll
              )

          $productVersion = $versionInfo.ProductVersion

          if ([string]::IsNullOrWhiteSpace($productVersion)) {
              throw "The published PaperRoute binary does not contain a ProductVersion."
          }

          $normalizedVersion =
              ($productVersion -split '\+')[0]

          Write-Host "Expected version:  $expected"
          Write-Host "Binary version:    $productVersion"
          Write-Host "Normalized binary: $normalizedVersion"

          if ($normalizedVersion -ne $expected) {
              throw "Release version mismatch. Tag expects '$expected' but the published binary reports '$productVersion'."
          }

          $numeric = '${{ steps.meta.outputs.numeric_version }}'
          $assemblyVersion = [Reflection.AssemblyName]::GetAssemblyName($publishedDll).Version.ToString()
          if ($assemblyVersion -cne $numeric -or $versionInfo.FileVersion -cne $numeric) {
              throw "Assembly/FileVersion must both equal '$numeric'."
          }
          foreach ($relativePath in @('docs/USER_GUIDE.md', 'LICENSE.txt', 'NOTICE.md')) {
              $source = Join-Path $env:GITHUB_WORKSPACE $relativePath
              $payload = Join-Path "$env:GITHUB_WORKSPACE/publish/win-x64" $relativePath
              if (-not (Test-Path -LiteralPath $payload -PathType Leaf) -or
                  (Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash -cne
                  (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash) {
                  throw "Published payload '$relativePath' is missing or differs from the source."
              }
          }

          Write-Host ""
          Write-Host "Binary/package version verification passed."

      - name: Download previous Preview Velopack release
        if: steps.meta.outputs.is_prerelease == 'true'
        continue-on-error: true
        shell: pwsh
        run: >
          dnx vpk --version 1.2.0 download github
          --repoUrl https://github.com/${{ github.repository }}
          --token "${{ github.token }}"
          --channel preview
          --pre true
          --outputDir "${{ github.workspace }}/Releases"

      - name: Download previous Stable Velopack release
        if: steps.meta.outputs.is_prerelease != 'true'
        continue-on-error: true
        shell: pwsh
        run: >
          dnx vpk --version 1.2.0 download github
          --repoUrl https://github.com/${{ github.repository }}
          --token "${{ github.token }}"
          --channel stable
          --outputDir "${{ github.workspace }}/Releases"

      - name: Build Velopack installer and update packages
        shell: pwsh
        run: >
          dnx vpk --version 1.2.0 pack
          --packId JUhalt.PaperRouteTracker
          --packVersion "${{ steps.meta.outputs.version }}"
          --packDir "${{ github.workspace }}/publish/win-x64"
          --mainExe PaperRouteTracker.exe
          --packTitle "PaperRoute Tracker"
          --packAuthors "Joshua Uhalt"
          --icon "${{ github.workspace }}/ManuscriptPipeline/Assets/PaperRoute.ico"
          --releaseNotes "${{ github.workspace }}/${{ steps.meta.outputs.notes_path }}"
          --channel "${{ steps.meta.outputs.channel }}"
          --outputDir "${{ github.workspace }}/Releases"

      - name: Upload Preview assets to a new GitHub draft
        if: steps.meta.outputs.is_prerelease == 'true'
        shell: pwsh
        run: >
          dnx vpk --version 1.2.0 upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token "${{ github.token }}"
          --channel preview
          --outputDir "${{ github.workspace }}/Releases"
          --publish false
          --pre true
          --merge false
          --releaseName "PaperRoute Tracker v${{ steps.meta.outputs.version }}"
          --tag "v${{ steps.meta.outputs.version }}"
          --targetCommitish "${{ github.sha }}"

      - name: Upload Stable assets to a new GitHub draft
        if: steps.meta.outputs.is_prerelease != 'true'
        shell: pwsh
        run: >
          dnx vpk --version 1.2.0 upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token "${{ github.token }}"
          --channel stable
          --outputDir "${{ github.workspace }}/Releases"
          --publish false
          --merge false
          --releaseName "PaperRoute Tracker v${{ steps.meta.outputs.version }}"
          --tag "v${{ steps.meta.outputs.version }}"
          --targetCommitish "${{ github.sha }}"

      - name: Verify Velopack upload and stage exact release checksums
        id: assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          ./.github/scripts/Verify-ReleaseAssets.ps1
          -Mode Stage
          -Repository "${{ github.repository }}"
          -Version "${{ steps.meta.outputs.version }}"
          -Channel "${{ steps.meta.outputs.channel }}"

      - name: Attach required documentation and checksums to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json databaseId,isDraft
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the draft before attaching documents.' }
          $draft = ($json | Out-String) | ConvertFrom-Json
          if (-not $draft.isDraft -or $draft.databaseId -ne [long] '${{ steps.assets.outputs.release_id }}') {
              throw 'The verified draft was published or replaced; no further assets will be uploaded.'
          }
          $required = @('RELEASE_NOTES.md', 'USER_GUIDE.md', 'UPGRADE_NOTES.md', 'LICENSE.txt', 'NOTICE.md', 'SHA256SUMS.txt')
          $paths = @($required | ForEach-Object {
              $path = Join-Path "$env:GITHUB_WORKSPACE/ReleaseAssets" $_
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Required asset '$_' is missing." }
              $path
          })
          gh release upload $env:GITHUB_REF_NAME @paths --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not attach every required release document/checksum.' }
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=true `
              --notes-file '${{ steps.meta.outputs.notes_path }}' --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Could not set the exact versioned release notes on the draft.' }

      - name: Preserve verified release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: PaperRouteTracker-Velopack-${{ steps.meta.outputs.channel }}
          path: |
            ReleaseAssets/
            ReleaseVerification/Stage-verification.json
          if-no-files-found: error
          retention-days: 14

      # GitHub's update-release endpoint publishes when draft=false. Use the
      # verified database ID so publication cannot resolve a replacement by tag.
      - name: Verify every uploaded asset and publish the completed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./.github/scripts/Verify-ReleaseAssets.ps1 -Mode Verify `
              -Repository $env:GITHUB_REPOSITORY -Version '${{ steps.meta.outputs.version }}' `
              -Channel '${{ steps.meta.outputs.channel }}' -ExpectedReleaseId '${{ steps.assets.outputs.release_id }}'
          if (-not $?) { throw 'Final release verification failed.' }
          $latest = if ('${{ steps.meta.outputs.is_prerelease }}' -eq 'true') { 'false' } else { 'true' }
          $releaseId = [long] '${{ steps.assets.outputs.release_id }}'
          $json = gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" `
              -F draft=false -f "make_latest=$latest"
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified release. Inspect its state before retrying.' }
          $published = ($json | Out-String) | ConvertFrom-Json
          if ($published.id -ne $releaseId -or $published.tag_name -cne $env:GITHUB_REF_NAME -or
              $published.draft -or $published.prerelease -ne ('${{ steps.meta.outputs.is_prerelease }}' -eq 'true')) {
              throw 'The publication response did not confirm the expected release identity/state. Inspect the release before retrying.'
          }
          "Published $env:GITHUB_REF_NAME after verifying the complete uploaded asset set and SHA-256 checksums." >> $env:GITHUB_STEP_SUMMARY
