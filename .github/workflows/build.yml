name: CI
run-name: "CI • ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # global.json pins the SDK, and so the runtime a self-contained
      # publish bundles; it moves only with THIRD-PARTY-NOTICES.txt (#269).
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ManuscriptPipeline.slnx

      # PaperRoute bundles the .NET runtime and three packages, so a security
      # fix reaches users only through a release; this run goes red on any
      # known advisory, direct or transitive (#144). A finding, a problem
      # fetching the data, or a failed command all fail the step.
      - name: Check packages for known vulnerabilities
        shell: pwsh
        run: |
          $report = dotnet list ManuscriptPipeline.slnx package --vulnerable --include-transitive --format json
          $exitCode = $LASTEXITCODE
          $report | Write-Host
          if ($exitCode -ne 0) { throw "dotnet list package --vulnerable failed with exit code $exitCode." }
          $scan = ($report | Out-String) | ConvertFrom-Json
          $problems = @(if ($null -ne $scan.PSObject.Properties['problems']) { $scan.problems })
          if ($problems.Count -gt 0) { throw 'The vulnerability scan reported a problem; see its output above.' }
          $findings = @($scan.projects | ForEach-Object { if ($null -ne $_.PSObject.Properties['frameworks']) { $_.frameworks } } |
              ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } |
              Where-Object { $null -ne $_ -and $null -ne $_.PSObject.Properties['vulnerabilities'] -and @($_.vulnerabilities).Count -gt 0 })
          if ($findings.Count -gt 0) {
              throw "Known vulnerabilities in: $(($findings | ForEach-Object { "$($_.id) $($_.resolvedVersion)" } | Sort-Object -Unique) -join ', ')."
          }
          Write-Host 'No known vulnerabilities in the restored package graph.'

      - name: Verify release asset checks with synthetic fixtures
        shell: pwsh
        run: ./ManualCertification/Test-ReleaseAssetVerifier.ps1 -RunName ci

      - name: Build Release
        run: dotnet build ManuscriptPipeline.slnx --configuration Release --no-restore

      - name: Build disposable workflow demo
        run: dotnet build ManualCertification/V04Demo/PaperRoute.V04Demo.csproj --configuration Release

      - name: Build display evidence tool
        run: dotnet build ManualCertification/DisplayEvidence/PaperRoute.DisplayEvidence.vbproj --configuration Release

      - name: Give the runner a 1920x1080 display
        # The tests size windows for the certified screens (#93), and the
        # runner's session starts at 1024x768. The script logs the size it
        # got; a display that cannot take it changes nothing.
        shell: pwsh
        continue-on-error: true
        run: ./.github/scripts/Set-RunnerDisplay.ps1
      - name: Run automated tests
        shell: pwsh
        # The runner is disposable, so the file-dialog tests, which leave
        # Explorer's view state under HKCU, run here too (#196). The
        # OnScreen tests need an unlocked desktop in use, so certification
        # runs them by hand. Every other test must pass, none skipped or
        # inconclusive, as the release workflow requires: a skipped test
        # fails here, on its pull request, not at release time.
        env:
          PAPERROUTE_FILE_DIALOG_TESTS: "1"
        run: |
          dotnet test PaperRoute.Tests/PaperRoute.Tests.vbproj --configuration Release --no-build `
              --filter 'TestCategory!=OnScreen' `
              --logger 'trx;LogFileName=PaperRoute.Tests.trx' --results-directory "$env:GITHUB_WORKSPACE/TestResults"
          if ($LASTEXITCODE -ne 0) { throw 'The automated test run failed.' }
          $trx = [xml]::new()
          $trx.XmlResolver = $null
          $trx.Load((Join-Path $env:GITHUB_WORKSPACE 'TestResults/PaperRoute.Tests.trx'))
          $counters = $trx.SelectSingleNode('//*[local-name()="ResultSummary"]/*[local-name()="Counters"]')
          if ($null -eq $counters -or [int] $counters.GetAttribute('total') -lt 1 -or
              [int] $counters.GetAttribute('passed') -ne [int] $counters.GetAttribute('total')) {
              throw 'Tests must all pass, with none skipped or inconclusive.'
          }
          "Tests: $($counters.GetAttribute('passed')) passed; none skipped." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PaperRoute-test-results
          path: |
            TestResults/
            artifacts/release-verifier-tests/ci/report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Windows x64
        run: >
          dotnet publish
          ManuscriptPipeline/ManuscriptPipeline.vbproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:PublishDir=${{ github.workspace }}/publish/win-x64/

      - name: Upload Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PaperRouteTracker-win-x64
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 14
