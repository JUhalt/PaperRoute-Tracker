name: CI
run-name: "CI • ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

# release/v1.0.x gets its patches through pull requests too, and
# release.yml may build a 1.0 tag from it, so CI runs there as on master.
# A branch's pushes and pull requests use that branch's copy of this file,
# so this takes effect there once the branch carries it.
on:
  push:
    branches:
      - master
      - release/v1.0.x
  pull_request:
    branches:
      - master
      - release/v1.0.x
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # global.json pins the SDK, and so the runtime a self-contained
      # publish bundles; it moves only with THIRD-PARTY-NOTICES.txt (#269).
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ManuscriptPipeline.slnx

      # PaperRoute bundles the .NET runtime and three packages, so a security
      # fix reaches users only through a release; this run goes red on any
      # known advisory, direct or transitive (#144). A finding, a problem
      # fetching the data, or a failed command all fail the step.
      - name: Check packages for known vulnerabilities
        shell: pwsh
        run: |
          $report = dotnet list ManuscriptPipeline.slnx package --vulnerable --include-transitive --format json
          $exitCode = $LASTEXITCODE
          $report | Write-Host
          if ($exitCode -ne 0) { throw "dotnet list package --vulnerable failed with exit code $exitCode." }
          $scan = ($report | Out-String) | ConvertFrom-Json
          $problems = @(if ($null -ne $scan.PSObject.Properties['problems']) { $scan.problems })
          if ($problems.Count -gt 0) { throw 'The vulnerability scan reported a problem; see its output above.' }
          $findings = @($scan.projects | ForEach-Object { if ($null -ne $_.PSObject.Properties['frameworks']) { $_.frameworks } } |
              ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } |
              Where-Object { $null -ne $_ -and $null -ne $_.PSObject.Properties['vulnerabilities'] -and @($_.vulnerabilities).Count -gt 0 })
          if ($findings.Count -gt 0) {
              throw "Known vulnerabilities in: $(($findings | ForEach-Object { "$($_.id) $($_.resolvedVersion)" } | Sort-Object -Unique) -join ', ')."
          }
          Write-Host 'No known vulnerabilities in the restored package graph.'

      # release.yml's tag check and its newer-release check, run against
      # throwaway git repositories, since only a real tag runs release.yml.
      - name: Test the release tag checks
        shell: pwsh
        run: ./ManualCertification/Test-ReleaseTagChecks.ps1 -RunName ci

      - name: Verify release asset checks with synthetic fixtures
        shell: pwsh
        run: ./ManualCertification/Test-ReleaseAssetVerifier.ps1 -RunName ci

      # The core must call no Windows-only API (core stage 2). The script prints
      # its report and, with -FailOnWindowsOnly, ends with exit code 1 on any
      # windows-only row; it throws if it scanned fewer than 160 files. Its exit
      # code is kept, the report and its two summary lines are written, and only
      # then does the step fail, so a failure still leaves the rows to read.
      - name: Inventory Windows-only APIs in the core
        shell: pwsh
        run: |
          $global:LASTEXITCODE = 0
          $report = @(./.github/scripts/Get-WindowsOnlyApiInventory.ps1 -Root . -FailOnWindowsOnly)
          $exitCode = $LASTEXITCODE
          $report | Write-Host
          $report | Where-Object { $_ -like 'Files scanned:*' -or $_ -like 'Windows-only rows:*' } | ForEach-Object { "Core inventory: $_" } >> $env:GITHUB_STEP_SUMMARY
          if ($exitCode -ne 0) { throw "The core uses a Windows-only API (inventory exit code $exitCode); the rows are listed above." }

      - name: Build Release
        id: build-release
        run: dotnet build ManuscriptPipeline.slnx --configuration Release --no-restore

      - name: Build disposable workflow demo
        run: dotnet build ManualCertification/V04Demo/PaperRoute.V04Demo.csproj --configuration Release

      - name: Build display evidence tool
        run: dotnet build ManualCertification/DisplayEvidence/PaperRoute.DisplayEvidence.vbproj --configuration Release

      - name: Give the runner a 1920x1080 display
        # The tests size windows for the certified screens (#93), and the
        # runner's session starts at 1024x768. The script logs the size it
        # got; a display that cannot take it changes nothing.
        shell: pwsh
        continue-on-error: true
        run: ./.github/scripts/Set-RunnerDisplay.ps1
      - name: Run automated tests
        shell: pwsh
        # The runner is disposable, so the file-dialog tests, which leave
        # Explorer's view state under HKCU, run here too (#196). The
        # OnScreen tests need an unlocked desktop in use, so certification
        # runs them by hand. Every other test must pass, none skipped or
        # inconclusive, as the release workflow requires: a skipped test
        # fails here, on its pull request, not at release time.
        env:
          PAPERROUTE_FILE_DIALOG_TESTS: "1"
        run: |
          dotnet test PaperRoute.Tests/PaperRoute.Tests.vbproj --configuration Release --no-build `
              --filter 'TestCategory!=OnScreen' `
              --logger 'trx;LogFileName=PaperRoute.Tests.trx' --results-directory "$env:GITHUB_WORKSPACE/TestResults"
          if ($LASTEXITCODE -ne 0) { throw 'The automated test run failed.' }
          $trx = [xml]::new()
          $trx.XmlResolver = $null
          $trx.Load((Join-Path $env:GITHUB_WORKSPACE 'TestResults/PaperRoute.Tests.trx'))
          $counters = $trx.SelectSingleNode('//*[local-name()="ResultSummary"]/*[local-name()="Counters"]')
          if ($null -eq $counters -or [int] $counters.GetAttribute('total') -lt 1 -or
              [int] $counters.GetAttribute('passed') -ne [int] $counters.GetAttribute('total')) {
              throw 'Tests must all pass, with none skipped or inconclusive.'
          }
          "PaperRoute.Tests: $($counters.GetAttribute('passed')) passed; none skipped." >> $env:GITHUB_STEP_SUMMARY

      # The core's own tests (core stage 2): the same rule, every test passes
      # and none is skipped. It runs whenever the build did, so a failure in
      # the step above still leaves this project's results to read, and the
      # job fails if either step fails. The summary adds the two counts.
      - name: Run core tests
        if: ${{ !cancelled() && steps.build-release.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet test PaperRoute.Core.Tests/PaperRoute.Core.Tests.vbproj --configuration Release --no-build `
              --logger 'trx;LogFileName=PaperRoute.Core.Tests.trx' --results-directory "$env:GITHUB_WORKSPACE/TestResults"
          if ($LASTEXITCODE -ne 0) { throw 'The core test run failed.' }
          $counts = @{}
          foreach ($name in 'PaperRoute.Tests', 'PaperRoute.Core.Tests') {
              $path = Join-Path $env:GITHUB_WORKSPACE "TestResults/$name.trx"
              if (-not (Test-Path -LiteralPath $path)) { continue }
              $trx = [xml]::new()
              $trx.XmlResolver = $null
              $trx.Load($path)
              $counters = $trx.SelectSingleNode('//*[local-name()="ResultSummary"]/*[local-name()="Counters"]')
              if ($null -ne $counters -and [int] $counters.GetAttribute('total') -ge 1 -and
                  [int] $counters.GetAttribute('passed') -eq [int] $counters.GetAttribute('total')) {
                  $counts[$name] = [int] $counters.GetAttribute('passed')
              }
          }
          if (-not $counts.ContainsKey('PaperRoute.Core.Tests')) {
              throw 'Core tests must all pass, with none skipped or inconclusive.'
          }
          "PaperRoute.Core.Tests: $($counts['PaperRoute.Core.Tests']) passed; none skipped." >> $env:GITHUB_STEP_SUMMARY
          if ($counts.ContainsKey('PaperRoute.Tests')) {
              "Tests: $($counts['PaperRoute.Tests'] + $counts['PaperRoute.Core.Tests']) passed in the two projects ($($counts['PaperRoute.Tests']) + $($counts['PaperRoute.Core.Tests'])); none skipped." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PaperRoute-test-results
          path: |
            TestResults/
            artifacts/release-verifier-tests/ci/report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Windows x64
        run: >
          dotnet publish
          ManuscriptPipeline/ManuscriptPipeline.vbproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:PublishDir=${{ github.workspace }}/publish/win-x64/

      # The Avalonia Board trial (v1.1) lives beside the Windows Forms app and
      # must never ship inside it. The app's dependency list, from the build
      # and from the publish above (single-file, so the list is bundled and
      # only the copies in bin are readable), must not name the trial.
      - name: Check the Windows Forms app carries no Avalonia trial
        shell: pwsh
        run: |
          $roots = @('ManuscriptPipeline/bin/Release', 'publish/win-x64') | Where-Object { Test-Path -LiteralPath $_ }
          $depsFiles = @($roots | ForEach-Object { Get-ChildItem -LiteralPath $_ -Recurse -File -Filter 'PaperRouteTracker.deps.json' })
          if ($depsFiles.Count -eq 0) { throw 'No PaperRouteTracker.deps.json was found, so the trial guard had nothing to check.' }
          $names = @('Avalonia', 'PaperRoute.Desktop', 'PaperRoute.ViewModels')
          $hits = @(foreach ($file in $depsFiles) {
              $text = Get-Content -LiteralPath $file.FullName -Raw
              foreach ($name in $names) {
                  if ($text.IndexOf($name, [StringComparison]::OrdinalIgnoreCase) -ge 0) { "$($file.FullName) names $name" }
              }
          })
          if ($hits.Count -gt 0) { throw "The Windows Forms app's dependency list carries the Avalonia trial: $($hits -join '; ')." }
          Write-Host "No Avalonia trial assembly in: $(($depsFiles | ForEach-Object { $_.FullName }) -join ', ')."

      - name: Upload Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PaperRouteTracker-win-x64
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 14

  # The Avalonia Board trial (v1.1): its own solution, so the release
  # workflow, which builds ManuscriptPipeline.slnx, never restores or ships it.
  trial:
    name: Avalonia Board trial (Windows)
    runs-on: windows-latest
    # A hung headless test host must not hold the runner for GitHub's 360 minutes.
    timeout-minutes: 20
    env:
      # Avalonia.BuildServices reports build telemetry unless this is set.
      AVALONIA_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore PaperRoute.Desktop.slnx

      # The same scan as the Windows build's (#144), over Avalonia's package graph.
      - name: Check packages for known vulnerabilities
        shell: pwsh
        run: |
          $report = dotnet list PaperRoute.Desktop.slnx package --vulnerable --include-transitive --format json
          $exitCode = $LASTEXITCODE
          $report | Write-Host
          if ($exitCode -ne 0) { throw "dotnet list package --vulnerable failed with exit code $exitCode." }
          $scan = ($report | Out-String) | ConvertFrom-Json
          $problems = @(if ($null -ne $scan.PSObject.Properties['problems']) { $scan.problems })
          if ($problems.Count -gt 0) { throw 'The vulnerability scan reported a problem; see its output above.' }
          $findings = @($scan.projects | ForEach-Object { if ($null -ne $_.PSObject.Properties['frameworks']) { $_.frameworks } } |
              ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } |
              Where-Object { $null -ne $_ -and $null -ne $_.PSObject.Properties['vulnerabilities'] -and @($_.vulnerabilities).Count -gt 0 })
          if ($findings.Count -gt 0) {
              throw "Known vulnerabilities in: $(($findings | ForEach-Object { "$($_.id) $($_.resolvedVersion)" } | Sort-Object -Unique) -join ', ')."
          }
          Write-Host 'No known vulnerabilities in the restored package graph.'

      # The merge rule for Board timing comparisons (Measure-BoardPairs.ps1),
      # checked on canned measurements: no build and no run of the trial.
      - name: Check the Board pairs rule on canned measurements
        shell: pwsh
        run: ./ManualCertification/Test-BoardPairs.ps1

      - name: Build Release
        run: dotnet build PaperRoute.Desktop.slnx --configuration Release --no-restore

      - name: Run trial tests
        shell: pwsh
        # Headless tests (Avalonia.Headless with Skia): no desktop needed.
        # Every test must pass, none skipped or inconclusive; tests marked
        # Manual are run by hand only. The view tests' pictures (PNGs, a few
        # megabytes in all) go into TestResults/pictures, which the upload
        # below carries.
        env:
          PAPERROUTE_TRIAL_PICTURES: ${{ github.workspace }}/TestResults/pictures
        run: |
          dotnet test PaperRoute.Desktop.Tests/PaperRoute.Desktop.Tests.csproj --configuration Release --no-build `
              --filter 'TestCategory!=Manual' `
              --logger 'trx;LogFileName=PaperRoute.Desktop.Tests.trx' --results-directory "$env:GITHUB_WORKSPACE/TestResults"
          if ($LASTEXITCODE -ne 0) { throw 'The trial test run failed.' }
          $trx = [xml]::new()
          $trx.XmlResolver = $null
          $trx.Load((Join-Path $env:GITHUB_WORKSPACE 'TestResults/PaperRoute.Desktop.Tests.trx'))
          $counters = $trx.SelectSingleNode('//*[local-name()="ResultSummary"]/*[local-name()="Counters"]')
          if ($null -eq $counters -or [int] $counters.GetAttribute('total') -lt 1 -or
              [int] $counters.GetAttribute('passed') -ne [int] $counters.GetAttribute('total')) {
              throw 'Trial tests must all pass, with none skipped or inconclusive.'
          }
          "Trial tests: $($counters.GetAttribute('passed')) passed; none skipped." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload trial test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PaperRoute-trial-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  # The same trial on Ubuntu, judged as the Windows job is: the build must
  # succeed, and every trial test must pass, none skipped or inconclusive;
  # tests marked Manual are run by hand only. The timing rows are held here
  # too, with the same GitHub Actions multiplier. The tests that do not pass,
  # and the run's own messages when it fails (a hang or a crash ends it early
  # and leaves later tests with no result), are listed in the step summary
  # before the job fails, so a failure on Ubuntu alone can be read without the
  # artifact. It only reported, as a finding for the trial's question 5,
  # until the maintainer's decision of 2026-11-27 made it judge.
  trial-linux:
    name: Avalonia Board trial (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Avalonia.BuildServices reports build telemetry unless this is set.
      AVALONIA_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore PaperRoute.Desktop.slnx

      - name: Build Release
        run: dotnet build PaperRoute.Desktop.slnx --configuration Release --no-restore

      - name: Run trial tests
        shell: pwsh
        env:
          PAPERROUTE_TRIAL_PICTURES: ${{ github.workspace }}/TestResults/pictures
          TZ: Etc/UTC
          LANG: en_US.UTF-8
        run: |
          dotnet test PaperRoute.Desktop.Tests/PaperRoute.Desktop.Tests.csproj --configuration Release --no-build --blame-hang-timeout 5m `
              --filter 'TestCategory!=Manual' `
              --logger 'trx;LogFileName=PaperRoute.Desktop.Tests.trx' --results-directory "$env:GITHUB_WORKSPACE/TestResults"
          $exitCode = $LASTEXITCODE
          $path = Join-Path $env:GITHUB_WORKSPACE 'TestResults/PaperRoute.Desktop.Tests.trx'
          $counters = $null
          $runInfos = @()
          if (Test-Path -LiteralPath $path) {
              $trx = [xml]::new()
              $trx.XmlResolver = $null
              $trx.Load($path)
              $counters = $trx.SelectSingleNode('//*[local-name()="ResultSummary"]/*[local-name()="Counters"]')
              # The run's own messages. When the hang timeout or a crash ends
              # the test host, the hung test and every test after it leave no
              # result, and only an Error message here says so.
              $runInfos = @($trx.SelectNodes('//*[local-name()="ResultSummary"]/*[local-name()="RunInfos"]/*[local-name()="RunInfo"]'))
          }
          $runMessages = @($runInfos | Sort-Object -Stable { $_.GetAttribute('outcome') -ne 'Error' } |
              ForEach-Object { "$($_.GetAttribute('outcome')): $(($_.InnerText -replace '\s+', ' ').Trim())" })
          $endedEarly = @($runInfos | Where-Object { $_.GetAttribute('outcome') -eq 'Error' }).Count -gt 0
          $total = if ($null -eq $counters) { 0 } else { [int] $counters.GetAttribute('total') }
          $notPassed = if ($total -ge 1) { $total - [int] $counters.GetAttribute('passed') } else { 0 }
          if ($total -ge 1) {
              $line = "Board trial on Linux: $($counters.GetAttribute('passed')) of $total tests passed."
              if ($endedEarly -or ($exitCode -ne 0 -and $notPassed -eq 0)) {
                  $line += " The run did not end cleanly (dotnet test exit code $exitCode), so tests after a hang or crash may have no result."
              }
              $line >> $env:GITHUB_STEP_SUMMARY
          }
          # Only when the run failed: a clean run carries a Blame warning too.
          if ($exitCode -ne 0) {
              '' >> $env:GITHUB_STEP_SUMMARY
              'Run messages:' >> $env:GITHUB_STEP_SUMMARY
              '' >> $env:GITHUB_STEP_SUMMARY
              if ($runMessages.Count -eq 0) { '- None in the results file.' >> $env:GITHUB_STEP_SUMMARY }
              $runMessages | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
          }
          if ($total -lt 1) {
              $why = if ($runMessages.Count -gt 0) { " First run message: $($runMessages[0])" } else { '' }
              throw "The trial tests produced no results on Linux (dotnet test exit code $exitCode).$why"
          }
          if ($notPassed -gt 0) {
              $names = @($trx.SelectNodes('//*[local-name()="UnitTestResult"][not(@outcome="Passed")]') |
                  ForEach-Object { "$($_.GetAttribute('outcome')): $($_.GetAttribute('testName'))" } | Sort-Object)
              '' >> $env:GITHUB_STEP_SUMMARY
              "Not passing on Linux ($($names.Count)):" >> $env:GITHUB_STEP_SUMMARY
              '' >> $env:GITHUB_STEP_SUMMARY
              $names | ForEach-Object { "- ``$_``" } >> $env:GITHUB_STEP_SUMMARY
              "::error title=Board trial on Linux::$notPassed of $total trial tests do not pass on Linux. They are listed in this job's summary and in the PaperRoute-trial-linux-results artifact."
              throw 'Trial tests must all pass, with none skipped or inconclusive.'
          }
          if ($exitCode -ne 0) {
              throw "Every test that reported a result passed ($total), but dotnet test ended with exit code $exitCode; a hang or crash ends the run early. See the run messages in this job's summary and the Sequence file in the artifact."
          }

      - name: Upload trial test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PaperRoute-trial-linux-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  # The trial in a real X window on Linux: the question "does the Board trial
  # start on Linux?", as far as a runner without a desktop can answer it. The
  # trial is published for linux-x64 and started under a virtual display
  # (Xvfb) with a window manager; pictures of the screen, the trial's result
  # files and a summary are kept in the artifact. The job fails when the
  # tools cannot be installed, when the trial cannot be published, when the
  # test library cannot be written, when the display does not come up, when
  # the self-check does not pass, when the example window does not open or
  # does not end cleanly on its close request, or when the timed run in the
  # window does not end by itself with its rows. The timings themselves and
  # the platform check are recorded, never judged: a shared runner without a
  # desktop session says nothing firm about speed, a desktop's file dialog
  # or its browser. A person on a real Ubuntu desktop answers those (the
  # Linux checklist).
  trial-linux-window:
    name: Avalonia Board trial (Linux window under Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Avalonia.BuildServices reports build telemetry unless this is set.
      AVALONIA_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install a virtual display, a window manager and their tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox xdotool wmctrl x11-utils imagemagick

      - name: Publish the trial for Linux
        run: dotnet publish PaperRoute.Desktop/PaperRoute.Desktop.csproj --configuration Release --runtime linux-x64 --self-contained --output "$RUNNER_TEMP/board-trial"

      # The 500-manuscript TEST library, written by the manual test that
      # exists for the real-window run. It lands in TestResults/v11-trial.
      # A filter that matches no test still ends with exit code 0, so the
      # folder is looked for: a renamed test must not pass unseen.
      - name: Write the 500 test library
        env:
          TZ: Etc/UTC
          LANG: en_US.UTF-8
        run: |
          dotnet test PaperRoute.Desktop.Tests/PaperRoute.Desktop.Tests.csproj --configuration Release --filter "FullyQualifiedName~WriteLargeLibraryForMeasurement"
          if [ ! -d TestResults/v11-trial/large-500/data ]; then
            echo "::error title=Board trial on Linux::The manual test wrote no library in TestResults/v11-trial/large-500. Was it renamed?"
            exit 1
          fi

      - name: Show the trial's window
        shell: pwsh
        env:
          TZ: Etc/UTC
          LANG: en_US.UTF-8
        run: |
          ./.github/scripts/Show-TrialWindowOnLinux.ps1 `
              -Program "$env:RUNNER_TEMP/board-trial/PaperRoute.Desktop" `
              -Out "$env:GITHUB_WORKSPACE/TestResults/linux-window" `
              -Library "$env:GITHUB_WORKSPACE/TestResults/v11-trial/large-500" `
              -RequireWindow

      - name: Upload the pictures and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PaperRoute-trial-linux-window
          path: TestResults/linux-window/
          if-no-files-found: ignore
          retention-days: 14

  # The core and its own tests on Linux (core stage 2). Strict since the
  # stage's step 13: a windows-only row in the core's inventory, or a core
  # test that does not pass here, fails the job. The solution cannot build
  # here (it holds the net10.0-windows app), so the job builds the core
  # test project, which builds the core through its reference.
  core-linux:
    name: Core on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 'false' since core stage 2's step 13: a core test that does not pass on Linux
      # is listed in the step summary and fails the job. 'true' would turn those
      # failures into a warning again; the job would still fail if the tests could
      # not be run or produced no results.
      CORE_LINUX_REPORT_ONLY: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The same inventory as the Windows job's, as Markdown in the log. With
      # -FailOnWindowsOnly the script ends with exit code 1 on any windows-only
      # row, and as the step's only command that code ends the step: the job
      # fails, and the steps below do not run.
      - name: Inventory (no Windows-only API in the core)
        shell: pwsh
        run: ./.github/scripts/Get-WindowsOnlyApiInventory.ps1 -Root . -AsMarkdown -FailOnWindowsOnly

      - name: Restore the core tests
        run: dotnet restore PaperRoute.Core.Tests/PaperRoute.Core.Tests.vbproj

      - name: Build the core and its tests
        run: dotnet build PaperRoute.Core.Tests/PaperRoute.Core.Tests.vbproj --configuration Release --no-restore

      - name: Run core tests
        shell: pwsh
        env:
          TZ: Etc/UTC
          LANG: en_US.UTF-8
        run: |
          dotnet test PaperRoute.Core.Tests/PaperRoute.Core.Tests.vbproj --configuration Release --no-build --blame-hang-timeout 5m `
              --logger 'trx;LogFileName=PaperRoute.Core.Tests.trx' --results-directory "$env:GITHUB_WORKSPACE/TestResults"
          $exitCode = $LASTEXITCODE
          $path = Join-Path $env:GITHUB_WORKSPACE 'TestResults/PaperRoute.Core.Tests.trx'
          $counters = $null
          if (Test-Path -LiteralPath $path) {
              $trx = [xml]::new()
              $trx.XmlResolver = $null
              $trx.Load($path)
              $counters = $trx.SelectSingleNode('//*[local-name()="ResultSummary"]/*[local-name()="Counters"]')
          }
          if ($null -eq $counters) {
              'Core on Linux: no test results.' >> $env:GITHUB_STEP_SUMMARY
          }
          else {
              "Core on Linux: $($counters.GetAttribute('passed')) passed, $($counters.GetAttribute('failed')) failed, $([int] $counters.GetAttribute('total') - [int] $counters.GetAttribute('passed') - [int] $counters.GetAttribute('failed')) neither (skipped, inconclusive or not run), of $($counters.GetAttribute('total'))." >> $env:GITHUB_STEP_SUMMARY
          }
          if ($null -eq $counters -or [int] $counters.GetAttribute('total') -lt 1) {
              throw "The core tests produced no results on Linux (dotnet test exit code $exitCode)."
          }
          $total = [int] $counters.GetAttribute('total')
          $notPassed = $total - [int] $counters.GetAttribute('passed')
          if ($notPassed -eq 0) {
              if ($exitCode -ne 0) { throw "Every core test passed, but dotnet test ended with exit code $exitCode." }
              return
          }
          $names = @($trx.SelectNodes('//*[local-name()="UnitTestResult"][not(@outcome="Passed")]') |
              ForEach-Object { "$($_.GetAttribute('outcome')): $($_.GetAttribute('testName'))" } | Sort-Object)
          '' >> $env:GITHUB_STEP_SUMMARY
          "Not passing on Linux ($($names.Count)):" >> $env:GITHUB_STEP_SUMMARY
          '' >> $env:GITHUB_STEP_SUMMARY
          $names | ForEach-Object { "- ``$_``" } >> $env:GITHUB_STEP_SUMMARY
          if ($env:CORE_LINUX_REPORT_ONLY -eq 'true') {
              "::warning title=Core on Linux (report-only)::$notPassed of $total core tests do not pass on Linux yet. They are listed in this job's summary and in the PaperRoute-core-linux-results artifact."
              # dotnet test's exit code has been judged above. Left as it is, the
              # runner would end this step with it and fail the job after all.
              $global:LASTEXITCODE = 0
          }
          else {
              throw 'Core tests must all pass, with none skipped or inconclusive.'
          }

      - name: Upload core test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PaperRoute-core-linux-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  # REPORT-ONLY until the maintainer has read its first runs: the Board trial
  # and the core on macOS (build 24, #439). Nothing had been built or run on
  # macOS before this job, so its first runs show what differs there.
  #
  # How it never fails a pull request: every step has continue-on-error: true,
  # so a step that fails, or runs out of its own time limit (timeout-minutes),
  # is marked in the summary file as "did not work" and the job still ends
  # green. The steps' limits add up to less than the job's, so a hang is caught
  # by a step's limit and the summary and the upload still run. Problems are
  # written as warnings, never as errors. No other job needs this one, and it
  # must not be made a required check, so a macOS failure can never block a
  # merge. When the first runs have been read, the maintainer decides which
  # steps start to judge, as the Linux trial job does now.
  #
  # Two machines, both standard GitHub-hosted runners, free for public
  # repositories (docs.github.com, "GitHub-hosted runners", read 2026-11-27):
  # macos-26 is Apple silicon (M1, osx-arm64) and macos-26-intel is Intel
  # (osx-x64). Both run macOS 26, so a difference between them comes from the
  # chip, not the system. GitHub said in 2025 that x86_64 runners end in
  # August 2027 (actions/runner-images#13045); then the Intel row goes.
  trial-macos:
    name: Avalonia Board trial (macOS, ${{ matrix.machine }})
    runs-on: ${{ matrix.runner }}
    # More than the steps' limits added up (153 minutes), so that a step that
    # runs out of time is recorded and the job goes on to its summary.
    timeout-minutes: 165
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: Apple silicon
            runner: macos-26
            rid: osx-arm64
            slug: arm64
          - machine: Intel
            runner: macos-26-intel
            rid: osx-x64
            slug: x64
    env:
      # Avalonia.BuildServices reports build telemetry unless this is set.
      AVALONIA_TELEMETRY_OPTOUT: "1"
      MACHINE: ${{ matrix.machine }}
      # Everything this job keeps; the upload carries this folder only.
      OUT: ${{ github.workspace }}/TestResults/macos

    steps:
      - name: Check out repository
        id: checkout
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        id: dotnet
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        id: restore
        continue-on-error: true
        timeout-minutes: 10
        run: dotnet restore PaperRoute.Desktop.slnx

      - name: Build Release
        id: build
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: dotnet build PaperRoute.Desktop.slnx --configuration Release --no-restore

      # The trial's solution does not hold the core's tests; this builds them
      # and, through its reference, the core.
      - name: Build the core tests
        id: core_build
        if: steps.dotnet.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: dotnet build PaperRoute.Core.Tests/PaperRoute.Core.Tests.vbproj --configuration Release

      # Counted, never judged here: passed, failed, skipped, and the names of
      # the tests that do not pass, in the job summary and in core-tests.md.
      # The step is marked "did not work" unless every test passes.
      - name: Run core tests
        id: core_tests
        if: steps.core_build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        env:
          TZ: Etc/UTC
          LANG: en_US.UTF-8
        run: |
          $ErrorActionPreference = 'Continue'
          $results = Join-Path $env:OUT 'tests'
          dotnet test PaperRoute.Core.Tests/PaperRoute.Core.Tests.vbproj --configuration Release --no-build --blame-hang-timeout 5m `
              --logger 'trx;LogFileName=PaperRoute.Core.Tests.trx' --results-directory $results
          $exitCode = $LASTEXITCODE
          $path = Join-Path $results 'PaperRoute.Core.Tests.trx'
          $counters = $null
          if (Test-Path -LiteralPath $path) {
              $trx = [xml]::new()
              $trx.XmlResolver = $null
              $trx.Load($path)
              $counters = $trx.SelectSingleNode('//*[local-name()="ResultSummary"]/*[local-name()="Counters"]')
          }
          $lines = [System.Collections.Generic.List[string]]::new()
          $total = if ($null -eq $counters) { 0 } else { [int] $counters.GetAttribute('total') }
          $passed = 0
          if ($total -lt 1) { $lines.Add("Core tests on macOS ($env:MACHINE): no results (dotnet test exit code $exitCode).") }
          else {
              $passed = [int] $counters.GetAttribute('passed')
              $failed = [int] $counters.GetAttribute('failed')
              $skipped = [int] $counters.GetAttribute('notExecuted')
              $other = $total - $passed - $failed - $skipped
              $line = "Core tests on macOS ($env:MACHINE): $passed passed, $failed failed, $skipped skipped"
              if ($other -gt 0) { $line += ", $other neither (inconclusive, timed out or not run)" }
              $lines.Add("$line, of $total (dotnet test exit code $exitCode).")
              $names = @($trx.SelectNodes('//*[local-name()="UnitTestResult"][not(@outcome="Passed")]') |
                  ForEach-Object { "$($_.GetAttribute('outcome')): $($_.GetAttribute('testName'))" } | Sort-Object)
              if ($names.Count -gt 0) {
                  $lines.Add('')
                  $lines.Add("Not passing ($($names.Count)):")
                  $lines.Add('')
                  $names | ForEach-Object { $lines.Add("- ``$_``") }
              }
          }
          New-Item -ItemType Directory -Force -Path $env:OUT | Out-Null
          $lines | Set-Content -LiteralPath (Join-Path $env:OUT 'core-tests.md') -Encoding utf8
          $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if ($total -lt 1 -or $passed -ne $total -or $exitCode -ne 0) {
              "::warning title=Core on macOS ($env:MACHINE, report-only)::$($lines[0])"
              exit 1
          }
          exit 0

      # Headless tests (Avalonia.Headless with Skia), all but those marked
      # Manual, counted as the core's are. The view tests' pictures go into
      # the artifact.
      - name: Run trial tests
        id: trial_tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        env:
          PAPERROUTE_TRIAL_PICTURES: ${{ github.workspace }}/TestResults/macos/pictures
          TZ: Etc/UTC
          LANG: en_US.UTF-8
        run: |
          $ErrorActionPreference = 'Continue'
          $results = Join-Path $env:OUT 'tests'
          dotnet test PaperRoute.Desktop.Tests/PaperRoute.Desktop.Tests.csproj --configuration Release --no-build --blame-hang-timeout 5m `
              --filter 'TestCategory!=Manual' `
              --logger 'trx;LogFileName=PaperRoute.Desktop.Tests.trx' --results-directory $results
          $exitCode = $LASTEXITCODE
          $path = Join-Path $results 'PaperRoute.Desktop.Tests.trx'
          $counters = $null
          if (Test-Path -LiteralPath $path) {
              $trx = [xml]::new()
              $trx.XmlResolver = $null
              $trx.Load($path)
              $counters = $trx.SelectSingleNode('//*[local-name()="ResultSummary"]/*[local-name()="Counters"]')
          }
          $lines = [System.Collections.Generic.List[string]]::new()
          $total = if ($null -eq $counters) { 0 } else { [int] $counters.GetAttribute('total') }
          $passed = 0
          if ($total -lt 1) { $lines.Add("Trial tests on macOS ($env:MACHINE): no results (dotnet test exit code $exitCode).") }
          else {
              $passed = [int] $counters.GetAttribute('passed')
              $failed = [int] $counters.GetAttribute('failed')
              $skipped = [int] $counters.GetAttribute('notExecuted')
              $other = $total - $passed - $failed - $skipped
              $line = "Trial tests on macOS ($env:MACHINE): $passed passed, $failed failed, $skipped skipped"
              if ($other -gt 0) { $line += ", $other neither (inconclusive, timed out or not run)" }
              $lines.Add("$line, of $total (dotnet test exit code $exitCode).")
              $names = @($trx.SelectNodes('//*[local-name()="UnitTestResult"][not(@outcome="Passed")]') |
                  ForEach-Object { "$($_.GetAttribute('outcome')): $($_.GetAttribute('testName'))" } | Sort-Object)
              if ($names.Count -gt 0) {
                  $lines.Add('')
                  $lines.Add("Not passing ($($names.Count)):")
                  $lines.Add('')
                  $names | ForEach-Object { $lines.Add("- ``$_``") }
              }
          }
          New-Item -ItemType Directory -Force -Path $env:OUT | Out-Null
          $lines | Set-Content -LiteralPath (Join-Path $env:OUT 'trial-tests.md') -Encoding utf8
          $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if ($total -lt 1 -or $passed -ne $total -or $exitCode -ne 0) {
              "::warning title=Board trial on macOS ($env:MACHINE, report-only)::$($lines[0])"
              exit 1
          }
          exit 0

      - name: Publish the trial for this Mac
        id: publish
        if: steps.dotnet.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: dotnet publish PaperRoute.Desktop/PaperRoute.Desktop.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained --output "$RUNNER_TEMP/board-trial"

      # The project ships unsigned: it pays no Apple fee, so it has no
      # Developer ID certificate. But macOS on Apple silicon runs only signed
      # code, and an ad-hoc signature (codesign --sign -, no certificate)
      # meets that rule. The .NET SDK already signs the program file ad hoc
      # when it builds on a Mac. This step checks every Mach-O file of the
      # published trial and, on Apple silicon only, signs ad hoc each one
      # whose signature is not valid. Intel Macs run unsigned code, so there
      # the files are only checked. The list is in codesign.txt. An ad-hoc
      # signature does not satisfy Gatekeeper for a downloaded app; that
      # needs a Developer ID and notarisation, which this job does not test.
      - name: Sign the published trial ad hoc where macOS needs it
        id: sign
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        env:
          SIGN: ${{ matrix.rid == 'osx-arm64' }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path $env:OUT | Out-Null
          # Each file is known as Mach-O by its own first four bytes: thin
          # (32-bit or 64-bit, either byte order) or universal. The `file` tool
          # is not used: for a universal file it prints more than one line,
          # so its lines cannot be paired with the files. Java class files
          # also start with CAFEBABE; the published trial has none.
          $machO = 'FEEDFACE', 'FEEDFACF', 'CEFAEDFE', 'CFFAEDFE', 'CAFEBABE', 'BEBAFECA', 'CAFEBABF', 'BFBAFECA'
          function Get-Magic([string] $path) {
              try {
                  $stream = [IO.File]::OpenRead($path)
                  try { $bytes = [byte[]]::new(4); $count = $stream.Read($bytes, 0, 4) } finally { $stream.Dispose() }
                  return [BitConverter]::ToString($bytes, 0, $count) -replace '-'
              }
              catch { return '' }
          }
          $files = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'board-trial') -Recurse -File | ForEach-Object FullName)
          $report = [System.Collections.Generic.List[string]]::new()
          $counts = @{ valid = 0; signed = 0; unsigned = 0; failed = 0 }
          foreach ($file in $files) {
              if ((Get-Magic $file) -notin $machO) { continue }
              $name = Split-Path -Leaf $file
              & codesign --verify $file 2>$null
              if ($LASTEXITCODE -eq 0) { $counts.valid++; $report.Add("valid: $name"); continue }
              if ($env:SIGN -ne 'true') { $counts.unsigned++; $report.Add("no valid signature, left so (Intel runs it): $name"); continue }
              $said = (& codesign --force --sign - $file 2>&1 | Out-String).Trim()
              & codesign --verify $file 2>$null
              if ($LASTEXITCODE -eq 0) { $counts.signed++; $report.Add("signed ad hoc here: $name") }
              else { $counts.failed++; $report.Add("could not be signed: $name ($said)") }
          }
          $report | Set-Content -LiteralPath (Join-Path $env:OUT 'codesign.txt') -Encoding utf8
          $line = "Signatures on macOS ($env:MACHINE): $($counts.valid) Mach-O files already valid, $($counts.signed) signed ad hoc here, $($counts.unsigned) left unsigned, $($counts.failed) could not be signed."
          $line | Set-Content -LiteralPath (Join-Path $env:OUT 'codesign.md') -Encoding utf8
          $line >> $env:GITHUB_STEP_SUMMARY
          if ($counts.valid + $counts.signed + $counts.unsigned + $counts.failed -eq 0) {
              '::warning title=Board trial on macOS (report-only)::No Mach-O file was found in the published trial.'
              exit 1
          }
          if ($counts.failed -gt 0) { exit 1 }
          exit 0

      # The self-check waits 120 s, as in the Linux window job, well inside the
      # step's limit, so a hang is stopped and written down here.
      - name: Run the self-check
        id: self_check
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 4
        shell: pwsh
        env:
          TZ: Etc/UTC
          LANG: en_US.UTF-8
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path $env:OUT | Out-Null
          $stdout = Join-Path $env:OUT 'self-check-stdout.txt'
          $code = $null
          try {
              $trial = Start-Process -FilePath (Join-Path $env:RUNNER_TEMP 'board-trial/PaperRoute.Desktop') -ArgumentList '--self-check' -PassThru `
                  -RedirectStandardOutput $stdout -RedirectStandardError (Join-Path $env:OUT 'self-check-stderr.txt')
              if ($trial.WaitForExit(120000)) {
                  $trial.WaitForExit()      # the last of its output reaches the files
                  $code = $trial.ExitCode
                  $result = "exit code $code"
              }
              else {
                  try { $trial.Kill($true) } catch { }
                  $result = 'no exit code: it did not end within 120 s and was stopped'
              }
          }
          catch { $result = "it could not be started: $($_.Exception.Message)" }
          $last = @(Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue | Where-Object { $_.Trim() } | Select-Object -Last 1)
          $line = "Self-check on macOS ($env:MACHINE): $result. Its last line: $(if ($last.Count -gt 0) { $last[0] } else { 'none' })"
          $line | Set-Content -LiteralPath (Join-Path $env:OUT 'self-check.md') -Encoding utf8
          $line | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if ($code -ne 0) { exit 1 }
          exit 0

      # The 500-manuscript TEST library, written by the manual test that
      # exists for the real-window run, as in the Linux window job. It lands
      # in TestResults/v11-trial, outside the uploaded folder. A filter that
      # matches no test still ends with exit code 0, so the folder is looked
      # for: a renamed test must not pass unseen.
      - name: Write the 500 test library
        id: library
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          TZ: Etc/UTC
          LANG: en_US.UTF-8
        run: |
          dotnet test PaperRoute.Desktop.Tests/PaperRoute.Desktop.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~WriteLargeLibraryForMeasurement"
          if [ ! -d TestResults/v11-trial/large-500/data ]; then
            echo "::warning title=Board trial on macOS ($MACHINE, report-only)::The manual test wrote no library in TestResults/v11-trial/large-500. Was it renamed?"
            exit 1
          fi

      # The example library in a real window on the runner's desktop: wait for
      # the window, take a picture of the screen, close it by its close button.
      - name: Show the trial's window
        id: window
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        env:
          TZ: Etc/UTC
          LANG: en_US.UTF-8
        run: ./.github/scripts/Show-TrialWindowOnMac.ps1 -Part Window -Program "$env:RUNNER_TEMP/board-trial/PaperRoute.Desktop" -Out "$env:OUT"

      # Before the platform check, as in the Linux window job: the launcher
      # opens a browser, which could cover the timed window. No time is judged.
      - name: Time the trial in its window
        id: measure
        if: steps.publish.outcome == 'success' && steps.library.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        env:
          TZ: Etc/UTC
          LANG: en_US.UTF-8
        run: ./.github/scripts/Show-TrialWindowOnMac.ps1 -Part Measure -Program "$env:RUNNER_TEMP/board-trial/PaperRoute.Desktop" -Out "$env:OUT" -Library "$env:GITHUB_WORKSPACE/TestResults/v11-trial/large-500"

      - name: Run the platform check
        id: platform
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        env:
          TZ: Etc/UTC
          LANG: en_US.UTF-8
        run: ./.github/scripts/Show-TrialWindowOnMac.ps1 -Part PlatformCheck -Program "$env:RUNNER_TEMP/board-trial/PaperRoute.Desktop" -Out "$env:OUT"

      # summary.md: for each step above, whether it worked, then the test
      # counts. The details are in the other files of the artifact.
      - name: Write the summary file
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
          RID: ${{ matrix.rid }}
          STEP_OUTCOMES: |
            Check out the repository|${{ steps.checkout.outcome }}
            Set up .NET 10|${{ steps.dotnet.outcome }}
            Restore the trial's solution|${{ steps.restore.outcome }}
            Build the trial's solution (Release)|${{ steps.build.outcome }}
            Build the core tests|${{ steps.core_build.outcome }}
            Core tests (all must pass to count as worked)|${{ steps.core_tests.outcome }}
            Trial tests (all must pass to count as worked)|${{ steps.trial_tests.outcome }}
            Publish the trial, self-contained|${{ steps.publish.outcome }}
            Check signatures, ad hoc where needed|${{ steps.sign.outcome }}
            Self-check|${{ steps.self_check.outcome }}
            Write the 500 test library|${{ steps.library.outcome }}
            Example library in a real window|${{ steps.window.outcome }}
            Timed run in the window (times not judged)|${{ steps.measure.outcome }}
            Platform check|${{ steps.platform.outcome }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path $env:OUT | Out-Null
          $words = @{ success = 'worked'; failure = 'did not work'; skipped = 'skipped: a step it needs did not work'; cancelled = 'cancelled' }
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("## The Board trial on macOS: $env:MACHINE ($env:RUNNER_LABEL, $env:RID)")
          $lines.Add('')
          $lines.Add('Report-only: no step here fails the job or a pull request.')
          $lines.Add('')
          $lines.Add('| Step | Result |')
          $lines.Add('|---|---|')
          foreach ($row in @($env:STEP_OUTCOMES -split "`n" | Where-Object { $_.Trim() })) {
              $name, $outcome = $row.Trim() -split '\|', 2
              $result = if ($outcome -and $words.ContainsKey($outcome)) { $words[$outcome] } else { 'not reached' }
              $lines.Add("| $name | $result |")
          }
          foreach ($file in 'core-tests.md', 'trial-tests.md', 'codesign.md', 'self-check.md') {
              $path = Join-Path $env:OUT $file
              if (Test-Path -LiteralPath $path) {
                  $lines.Add('')
                  Get-Content -LiteralPath $path | ForEach-Object { $lines.Add($_) }
              }
          }
          $lines.Add('')
          $lines.Add('Details: window.md, measure.md and platformcheck.md (facts), the pictures (*.png), measure-macos.json, platform-check-macos.json, codesign.txt, tests/ (results files) and pictures/ (the view tests).')
          $lines | Set-Content -LiteralPath (Join-Path $env:OUT 'summary.md') -Encoding utf8
          $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          exit 0

      - name: Upload the macOS results
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PaperRoute-trial-macos-${{ matrix.slug }}
          path: TestResults/macos/
          if-no-files-found: ignore
          retention-days: 14
