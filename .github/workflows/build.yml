name: CI
run-name: "CI • ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ManuscriptPipeline.slnx

      - name: Build Release
        run: dotnet build ManuscriptPipeline.slnx --configuration Release --no-restore

      - name: Build disposable workflow demo
        run: dotnet build ManualCertification/V04Demo/PaperRoute.V04Demo.csproj --configuration Release

      - name: Run automated tests
        run: dotnet test PaperRoute.Tests/PaperRoute.Tests.vbproj --configuration Release --no-build --logger "trx;LogFileName=PaperRoute.Tests.trx" --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: PaperRoute-test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Windows x64
        run: >
          dotnet publish
          ManuscriptPipeline/ManuscriptPipeline.vbproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:PublishDir=${{ github.workspace }}/publish/win-x64/

      - name: Upload Windows build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: PaperRouteTracker-win-x64
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 14
